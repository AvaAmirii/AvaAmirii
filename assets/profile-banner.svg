<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ava Amiri — Electronics, embedded systems, and digital design</title>
  <desc id="desc">A modern dark navy technology banner with clean typography, subtle circuit traces, and a glowing microcontroller illustration.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B16"/>
      <stop offset=".55" stop-color="#11152A"/>
      <stop offset="1" stop-color="#17102C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202748"/>
      <stop offset="1" stop-color="#111629"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".24"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A5B4FC" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#background)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <ellipse cx="900" cy="180" rx="330" ry="260" fill="url(#ambient)"/>

  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".55">
    <path d="M0 70h210l42 42h130"/><path d="M0 102h154l38 38h190"/>
    <path d="M0 290h220l38-38h124"/><path d="M1200 72h-104l-32 32h-94"/>
    <path d="M1200 292h-118l-38-38h-74"/>
  </g>
  <g fill="#C4B5FD" opacity=".9">
    <circle cx="210" cy="70" r="3"/><circle cx="154" cy="102" r="3"/>
    <circle cx="220" cy="290" r="3"/><circle cx="1096" cy="72" r="3"/>
    <circle cx="1082" cy="292" r="3"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="74" y="132" fill="#A78BFA" font-size="14" font-weight="700" letter-spacing="4">ELECTRICAL &amp; ELECTRONICS ENGINEER</text>
    <text x="70" y="205" fill="#F8FAFC" font-size="62" font-weight="750" letter-spacing="-2">AVA AMIRI</text>
    <rect x="74" y="228" width="84" height="4" rx="2" fill="url(#accent)"/>
    <text x="74" y="271" fill="#C7D2FE" font-size="19" font-weight="500">HARDWARE  /  FIRMWARE  /  DIGITAL DESIGN</text>
    <text x="74" y="310" fill="#94A3B8" font-size="14" letter-spacing="1">BUILD · TEST · ITERATE</text>
  </g>

  <!-- Microcontroller-inspired centerpiece -->
  <g transform="translate(824 77)">
    <circle cx="132" cy="105" r="130" fill="#8B5CF6" opacity=".12" filter="url(#soft-glow)"/>
    <g stroke="#A5B4FC" stroke-width="5" stroke-linecap="round" opacity=".8">
      <path d="M62 0v24M102 0v24M142 0v24M182 0v24"/>
      <path d="M62 186v24M102 186v24M142 186v24M182 186v24"/>
      <path d="M0 52h24M0 92h24M0 132h24M0 172h24"/>
      <path d="M240 52h24M240 92h24M240 132h24M240 172h24"/>
    </g>
    <rect x="24" y="24" width="216" height="162" rx="22" fill="url(#chip)" stroke="#A78BFA" stroke-width="2"/>
    <rect x="40" y="40" width="184" height="130" rx="14" fill="#0B1020" stroke="#334155"/>
    <path d="M54 77h48l13 13h40m-101 28h29l12-12h70m-94 36h36l12-12h48" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
    <circle cx="176" cy="70" r="5" fill="#67E8F9" filter="url(#soft-glow)"/>
    <text x="132" y="106" text-anchor="middle" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" letter-spacing="3">STM32</text>
    <text x="132" y="151" text-anchor="middle" fill="#A78BFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2">MCU · HDL · CODE</text>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="25" fill="none" stroke="#A5B4FC" stroke-opacity=".2"/>
</svg>
